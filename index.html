/* V4 : réponses lisibles, carte suivante à la place de la carte et curseur explicite */
.card-holder.answered .next-card{display:flex;animation:appear .35s both;cursor:pointer}
.card-holder:not(.answered) .next-card{display:none!important}
.feedback{flex:.52;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.1% 2.5%;gap:5px}
.feedback .text{width:100%}.feedback .feedback-title{font-size:clamp(14px,1.25vw,23px);font-weight:900;letter-spacing:0}

.feedback .comparison{min-width:0;align-items:center;flex-direction:row;justify-content:center;flex-wrap:wrap;gap:10px}
.comparison span{font-size:clamp(11px,.86vw,15px)}.comparison .result{font-size:clamp(11px,.9vw,15px);padding:6px 13px}

.meter{flex:.46;gap:7px}
.scale{overflow:visible}
.cell:first-child{border-radius:7px 0 0 7px}.cell:nth-child(24){border-radius:0 7px 7px 0}

.next-card{height:100%;min-height:0}

.zone{gap:clamp(8px,1.35vw,20px)}

.zone.selected{background:#ffffff14!important}.zone.reference{border-color:#fff}

.meter-top span{font-size:clamp(12px,.95vw,17px)!important}

.marker{background:#fff;width:5px!important;top:-6px!important;bottom:-6px!important;z-index:3;border-radius:3px;box-shadow:0 0 0 2px #182532,0 0 20px #fff!important}

/* V9 — consultation des cartes jouées directement dans la frise */
.marker{pointer-events:none}
.export-button.active{background:#dfeef2;color:#112431;border-color:#dfeef2}

.cell{border-right:1px solid #13253888}

.review-mode .cell.played-green{background:#6bdaab!important;color:#10202c!important;box-shadow:inset 0 0 0 2px #dff8ec!important}
.review-mode .cell.played-yellow{background:#ffce7e!important;color:#16212b!important;box-shadow:inset 0 0 0 2px #fff0bf!important}

.review-mode .cell.played-yellow:hover,.review-mode .cell.played-yellow.focused{background:#ffd995!important;color:#121d27!important;box-shadow:inset 0 0 0 3px #fff8de!important;transform:translateY(-2px)}
.review-mode .cell.played-red:hover,.review-mode .cell.played-red.focused{background:#f59ca6!important;color:#171a20!important;box-shadow:inset 0 0 0 3px #fff0f2!important;transform:translateY(-2px)}
.review-mode .game{opacity:.26;pointer-events:none;filter:grayscale(.4)}
.review-mode .meter{border-color:#7e9caf}
.review-mode .meter-top span{color:#dceaf2}
.review-mode .feedback{background:#ffffff10}
@media(max-width:620px){.result-pair{column-gap:10px}.result-pair>span:not(.versus){white-space:normal}.result-pair .versus{padding:0 2px}}

/* V14 — corrections ciblées des deux modes */
.scale-labels{display:grid!important;grid-template-columns:5fr 11fr 8fr!important;gap:0!important;align-items:center!important}
.scale-labels span{display:block;text-align:center!important;white-space:nowrap;font-size:clamp(10px,.85vw,16px)!important;letter-spacing:-.01em}
.next-card:hover,.next-card:hover span{color:#9cc6d8!important}
/* Seul le paquet choisi passe en bordure pleine ; les autres conservent le pointillé. */
.zone:not(.selected),.zone.reference:not(.selected){border-style:dashed!important;border-width:1px!important;box-shadow:none!important}
.zone.selected{border-style:solid!important;border-width:2px!important;box-shadow:0 0 36px #ffffff18,inset 0 0 28px #ffffff10!important}
/* Le triangle et la barre verticale ne sont jamais affichés en consultation. */
.review-mode .marker,.review-mode .marker:after{display:none!important}
/* Les états de validation et les choix sont colorés selon leur propre zone. */
.feedback-title .status-good{font-weight:900}
.feedback-title .result-pair .choice-result,.feedback-title .result-pair .reference-result{font-weight:800}

/* V15 — couleurs des pictogrammes et titres des paquets */
.zone[data-zone="green"] .glyph,.zone[data-zone="green"] b{color:#81e5af!important}
.zone[data-zone="yellow"] .glyph,.zone[data-zone="yellow"] b{color:#ffcb70!important}
.zone[data-zone="red"] .glyph,.zone[data-zone="red"] b{color:#ff8892!important}
/* Matérial Symbol fact_check intégré en SVG, sans dépendance réseau. */
.export-button .fact-check-icon{display:block;width:21px;height:21px;flex-shrink:0}

/* V19 — mode plein écran natif, sans modifier le jeu */
.fullscreen-button{width:45px;height:45px;border-radius:50%;background:#ffffff0c;border:1px solid #546477;color:#eaf3f9;display:grid;place-items:center;flex-shrink:0;transition:background .2s}
.fullscreen-button:hover{background:#ffffff22}

.fullscreen-button .exit-icon{display:none}
.fullscreen-button.is-fullscreen .enter-icon{display:none}
.fullscreen-button.is-fullscreen .exit-icon{display:block}
.stage:fullscreen,.stage:-webkit-full-screen{width:100vw;height:100vh;max-width:none;aspect-ratio:auto;border:0;box-shadow:none}
/* Secours pour les navigateurs qui refusent l’API Fullscreen sur un HTML local. */
body.fullscreen-fallback{display:block;overflow:hidden}
.stage.fullscreen-fallback-stage{position:fixed;inset:0;width:100vw;height:100dvh;max-width:none;aspect-ratio:auto;z-index:9999;border:0;box-shadow:none}

<body>
<div class="stage" id="stage">
 <header class="top"><div class="identity"><div class="title">LE VIOLENTOMÈTRE</div></div><div class="header-actions"><button class="export-button" id="export" title="Consulter le bilan des cartes jouées" aria-label="Consulter le bilan des cartes jouées"><span>BILAN</span></button><button class="fullscreen-button" id="fullscreen" type="button" title="Passer en plein écran" aria-label="Passer en plein écran" aria-pressed="false"><svg class="enter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg><svg class="exit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"/></svg></button><button class="reset" id="reset" title="Recommencer" aria-label="Recommencer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11a9 9 0 1 1 2.6 6.4"/><path d="M3 4v7h7"/></svg></button></div></header>
 <main class="content">
  <div class="game"><div class="card-column"><div class="counter">SITUATION <strong id="num">01</strong> / 24</div><div class="card-holder"><div class="card" id="card" tabindex="0" role="group" aria-label="Situation à classer" draggable="true"><div class="tag">DANS UNE RELATION AMOUREUSE…</div><div class="statement" id="statement"></div><div class="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 4 4 8l4 4M16 4l4 4-4 4M4 8h16M8 20l-4-4 4-4M16 20l4-4-4-4M4 16h16"/></svg> GLISSER LA CARTE</div></div><button class="next-card" id="next" hidden aria-label="Passer à la carte suivante">CARTE SUIVANTE</button></div></div>

 </main>
 <footer class="foot"><div class="dots" id="dots" aria-label="Progression des 24 situations"></div><div class="help">Besoin d’aide : <strong>3919</strong> · Urgence : <strong>17 / 112</strong></div></footer>

<script>
(()=>{
'use strict';
// Libellés du violentomètre, version du 27/08/2024 (Centre Hubertine Auclert).
// Libellés intégralement repris de l'édition à 24 phrases (affiche Violentomètre).
const labels=[
'Respecte tes décisions et tes goûts',
'Accepte tes ami.e.s et ta famille',
'A confiance en toi',
'Est content quand tu te sens épanouie',
'S’assure de ton accord pour ce que vous faites ensemble',
'T’ignore des jours quand il est en colère',
'Te fait du chantage si tu refuses de faire quelque chose',
'Rabaisse tes opinions et tes projets',
'Se moque de toi en public',
'Te manipule',
'Est jaloux en permanence',
'Contrôle tes sorties, habits, maquillage',
'Fouille tes textos, mails, applis',
'Insiste pour que tu envoies des photos intimes',
'T’isole de ta famille et de tes ami.e.s',
'Te traite de folle quand tu lui fais des reproches',
'« Pète les plombs » lorsque quelque chose lui déplaît',
'Menace de se suicider à cause de toi',

];
const explanations=["La personne respecte tes choix, même lorsqu’elle a des goûts différents.", "Tu peux conserver tes amitiés et tes liens familiaux librement.", "La confiance ne demande ni surveillance ni preuve permanente.", "Elle se réjouit de ton épanouissement et de tes activités personnelles.", "Votre accord à tous les deux compte pour chaque activité partagée.", "Ignorer volontairement quelqu’un plusieurs jours pour le punir est une forme de pression.", "Le chantage cherche à obtenir quelque chose malgré un refus.", "Dévaloriser tes opinions ou tes projets fragilise ta confiance en toi.", "Se moquer de toi devant d’autres personnes peut être humiliant.", "Manipuler une personne revient à influencer ses choix en contournant sa volonté.", "La jalousie permanente ne justifie jamais de restreindre ta liberté.", "Contrôler tes sorties ou tes vêtements porte atteinte à ton autonomie.", "Fouiller tes messages et tes applications est une atteinte à ta vie privée.", "Insister pour obtenir des images intimes ne respecte pas ton consentement.", "T’isoler de tes proches peut augmenter ton sentiment de dépendance.", "Te faire passer pour folle afin de discréditer tes reproches est une violence psychologique.", "Des explosions de colère intimidantes installent un climat de peur.", "Menacer de se suicider pour te retenir fait peser sur toi une responsabilité injuste.", "Menacer de diffuser des photos intimes constitue un chantage grave.", "Pousser, tirer, gifler, secouer ou frapper sont des violences physiques.", "Toucher les parties intimes sans consentement constitue une violence sexuelle.", "Imposer des relations sexuelles constitue une violence sexuelle grave.", "Menacer avec une arme indique un danger majeur et nécessite une protection urgente.", "Une menace de mort doit toujours être prise au sérieux : cherche de l’aide et mets-toi en sécurité."];
const $=id=>document.getElementById(id), card=$('card'), zones=[...document.querySelectorAll('.zone')];
let order=[],index=0,busy=false,run=0,drag=null,ghost=null,history=[],viewMode=false,completed=false;
const zoneFor=n=>n<=5?'green':n<=16?'yellow':'red';
const names={green:'RELATION SAINE',yellow:'VIGILANCE',red:'DANGER'};
const colors={green:'#81e5af',yellow:'#ffcb70',red:'#ff8892'};
function shuffle(){const a=Array.from({length:24},(_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildScale(){let h='';for(let n=1;n<=24;n++)h+=`<span class="cell" data-n="${n}">${n}</span>`;h+='<div class="marker hidden" id="marker"></div>';$('scale').innerHTML=h;}
function dots(){ $('dots').innerHTML=order.map((_,i)=>`<span class="dot ${i<index?'done':i===index?'current':''}"></span>`).join('');}
function showCard(){
 const n=order[index];busy=false;
 $('card').parentElement.classList.remove('answered');$('next').hidden=true;
 card.style.display='';card.classList.remove('out','in');void card.offsetWidth;card.classList.add('in');
 $('statement').textContent=labels[n];$('num').textContent=String(index+1).padStart(2,'0');
 $('scale').classList.add('blind');$('marker').classList.add('hidden');
 $('meterStatus').textContent='Référence masquée';$('feedback').classList.add('idle');
 $('feedbackTitle').textContent='';$('official').textContent='';$('comparison').hidden=true;$('comparison').innerHTML='';
 zones.forEach(z=>{z.classList.remove('selected','reference','over');z.disabled=false;});dots();
}
function next(){if(!$('card').parentElement.classList.contains('answered'))return;
 $('next').hidden=true;
 if(++index>=24){completed=true;busy=true;card.parentElement.classList.remove('answered');card.style.display='none';$('next').hidden=true;$('num').textContent='24';$('meterStatus').textContent='24 SITUATIONS EXPLORÉES';$('feedbackTitle').textContent='24 SITUATIONS EXPLORÉES';$('official').textContent='Clique sur BILAN pour retrouver tes choix dans les 24 repères.';$('feedback').classList.remove('idle');$('marker').classList.add('hidden');dots();return;}
 showCard();}
function feedbackHeader(chosen,ref,match){
 const choiceColor=colors[chosen],refColor=colors[ref];
 if(match)return `<span class="status-good" style="color:${refColor}">✓ BON CLASSEMENT · ${names[ref]}</span>`;
 return `<span class="result-pair"><span class="choice-result" style="color:${choiceColor}">TON CHOIX : <strong>${names[chosen]}</strong></span><span class="versus" style="color:${refColor}">VS</span><span class="reference-result" style="color:${refColor}">RÉFÉRENCE : <strong>${names[ref]}</strong></span></span>`;
}
function reveal(zone){
 if(!$('card').parentElement || index>=24)return;
 const n=order[index]+1,ref=zoneFor(n),match=zone===ref;
 history.push({id:n,chosen:zone,ref,match});
 $('scale').classList.remove('blind');$('marker').style.left=`${((n-.5)/24)*100}%`;
 $('marker').classList.remove('hidden');$('meterStatus').textContent=`REPÈRE OFFICIEL N° ${n} / 24`;
 $('feedback').classList.remove('idle');
 $('feedbackTitle').innerHTML=feedbackHeader(zone,ref,match);
 $('feedbackTitle').style.color='#f2f5f8';
 $('official').textContent=`${labels[n-1]} : ${explanations[n-1]}`;
 zones.forEach(z=>{z.disabled=true;if(z.dataset.zone===zone)z.classList.add('selected');});
 $('comparison').hidden=true;
 $('next').hidden=false;card.parentElement.classList.add('answered');dots();
}

function choose(zone,target=null){if(busy)return;const token=run;busy=true;card.classList.remove('in');zones.forEach(z=>z.classList.remove('over'));const dst=target||zones.find(z=>z.dataset.zone===zone);const start=card.getBoundingClientRect(),end=dst.getBoundingClientRect();const clone=card.cloneNode(true);clone.removeAttribute('id');clone.className='card fly';Object.assign(clone.style,{left:start.left+'px',top:start.top+'px',width:start.width+'px',height:start.height+'px',minHeight:'0',maxHeight:'none',margin:'0',transform:'rotate(-1deg)'});document.body.appendChild(clone);card.classList.add('out');const anim=clone.animate([{left:start.left+'px',top:start.top+'px',transform:'rotate(-1deg) scale(1)',opacity:1},{left:(end.left+(end.width-start.width)/2)+'px',top:(end.top+(end.height-start.height)/2)+'px',transform:'rotate(4deg) scale(.43)',opacity:.1}],{duration:480,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'});anim.finished.then(()=>clone.remove()).catch(()=>clone.remove());setTimeout(()=>{if(run===token)reveal(zone);},490);}
function restart(){run++;history=[];completed=false;viewMode=false;$('stage').classList.remove('review-mode');$('export').classList.remove('active');$('export').querySelector('span').textContent='BILAN';$('export').setAttribute('aria-label','Consulter le bilan des cartes jouées');document.querySelectorAll('.cell').forEach(c=>c.classList.remove('played','unplayed','focused','played-green','played-yellow','played-red'));if(ghost){ghost.remove();ghost=null;}document.querySelectorAll('.fly').forEach(x=>x.remove());drag=null;order=shuffle();index=0;busy=false;showCard();}
zones.forEach(el=>{el.addEventListener('click',()=>choose(el.dataset.zone,el));el.addEventListener('dragover',e=>{if(busy)return;e.preventDefault();el.classList.add('over');});el.addEventListener('dragleave',()=>el.classList.remove('over'));el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('over');choose(el.dataset.zone,el);});});
card.addEventListener('dragstart',e=>{if(busy){e.preventDefault();return;}if(drag){e.preventDefault();return;}e.dataTransfer.setData('text/plain','card');e.dataTransfer.effectAllowed='move';});
// Tactile : le doigt entraîne une copie de la carte ; les zones restent aussi cliquables.
card.addEventListener('pointerdown',e=>{if(busy||e.pointerType==='mouse')return;drag={id:e.pointerId,startX:e.clientX,startY:e.clientY};card.setPointerCapture(e.pointerId);});
card.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const moved=Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY);if(moved<8&&!ghost)return;if(!ghost){const r=card.getBoundingClientRect();ghost=card.cloneNode(true);ghost.removeAttribute('id');Object.assign(ghost.style,{position:'fixed',zIndex:'100',pointerEvents:'none',width:r.width+'px',height:r.height+'px',minHeight:'0',left:r.left+'px',top:r.top+'px',margin:'0',opacity:'.9',transform:'rotate(3deg) scale(.85)'});document.body.appendChild(ghost);}const r=ghost.getBoundingClientRect();ghost.style.left=e.clientX-r.width/2+'px';ghost.style.top=e.clientY-r.height/2+'px';let el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.zone');zones.forEach(z=>z.classList.toggle('over',z===el));});
function finish(e){if(!drag)return;drag=null;ghost?.remove();ghost=null;const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.zone');zones.forEach(z=>z.classList.remove('over'));if(el&&!busy)choose(el.dataset.zone,el);}
card.addEventListener('pointerup',finish);card.addEventListener('pointercancel',finish);
// Le mode « Voir » utilise la même frise, sans ouverture d'une deuxième page.
function showHistory(n){
 const rec=history.find(item=>item.id===n);
 if(!rec)return;
 $('meterStatus').textContent=`REPÈRE ${n} / 24 · CARTE JOUÉE`;
 $('marker').classList.add('hidden');
 $('feedback').classList.remove('idle');
 $('feedbackTitle').innerHTML=feedbackHeader(rec.chosen,rec.ref,rec.match);
 $('feedbackTitle').style.color='#f2f5f8';
 $('official').textContent=`${labels[n-1]} : ${explanations[n-1]}`;
 document.querySelectorAll('.cell').forEach((cell,i)=>cell.classList.toggle('focused',i+1===n));
}
function enableView(){
 if(!history.length)return;
 viewMode=true;
 $('stage').classList.add('review-mode');
 $('export').classList.add('active');
 $('export').querySelector('span').textContent='RETOUR';$('export').setAttribute('aria-label','Revenir au jeu');
 $('scale').classList.remove('blind');
 $('marker').classList.add('hidden');
 $('meterStatus').textContent=`${history.length} CARTE${history.length>1?'S':''} JOUÉE${history.length>1?'S':''} · CLIQUE SUR UN NUMÉRO`;
 const played=new Set(history.map(h=>h.id));
 document.querySelectorAll('.cell').forEach((cell,i)=>{
  let done=played.has(i+1);
  cell.classList.toggle('played',done);
  cell.classList.toggle('unplayed',!done);
  cell.classList.remove('focused','played-green','played-yellow','played-red');
  if(done){ const band=zoneFor(i+1); cell.classList.add(`played-${band}`); }
  cell.setAttribute('aria-label',done?`Revoir le repère ${i+1}`:`Repère ${i+1}, non joué`);
  cell.tabIndex=done?0:-1;
  cell.setAttribute('role',done?'button':'presentation');
 });
 $('feedback').classList.remove('idle');
 $('feedbackTitle').textContent='CARTES JOUÉES';
 $('feedbackTitle').style.color='#edf4f8';
 $('official').textContent='Sélectionne un repère mis en évidence pour revoir ton choix et la référence.';
}
function disableView(){
 viewMode=false;
 $('stage').classList.remove('review-mode');
 $('export').classList.remove('active');
 $('export').querySelector('span').textContent='BILAN';$('export').setAttribute('aria-label','Consulter le bilan des cartes jouées');
 document.querySelectorAll('.cell').forEach(cell=>{cell.classList.remove('played','unplayed','focused','played-green','played-yellow','played-red');cell.removeAttribute('role');cell.removeAttribute('aria-label');cell.removeAttribute('tabindex');});
 if(completed){
  $('marker').classList.add('hidden');
  $('meterStatus').textContent='24 SITUATIONS EXPLORÉES';
  $('feedbackTitle').textContent='24 SITUATIONS EXPLORÉES';
  $('feedbackTitle').style.color='#edf4f8';
  $('official').textContent='Clique sur BILAN pour retrouver tes choix dans les 24 repères.';
 } else if($('card').parentElement.classList.contains('answered')){
  const rec=history[history.length-1];
  $('scale').classList.remove('blind');
  $('marker').style.left=`${((rec.id-.5)/24)*100}%`;
  $('marker').classList.remove('hidden');
  $('meterStatus').textContent=`REPÈRE OFFICIEL N° ${rec.id} / 24`;
  $('feedbackTitle').innerHTML=feedbackHeader(rec.chosen,rec.ref,rec.match);
  $('feedbackTitle').style.color='#f2f5f8';
  $('official').textContent=`${labels[rec.id-1]} : ${explanations[rec.id-1]}`;
 } else {
  $('scale').classList.add('blind');
  $('marker').classList.add('hidden');
  $('meterStatus').textContent='Référence masquée';
  $('feedback').classList.add('idle');
  $('feedbackTitle').textContent='';
  $('official').textContent='';
 }
}
$('export').addEventListener('click',()=>viewMode?disableView():enableView());
$('scale').addEventListener('click',e=>{
 if(!viewMode)return;

 if(cell?.classList.contains('played'))showHistory(Number(cell.dataset.n));
});
$('scale').addEventListener('keydown',e=>{
 if(!viewMode||(e.key!=='Enter'&&e.key!==' '))return;

});
$('next').addEventListener('click',next);
$('reset').addEventListener('click',restart);
// Bouton plein écran : API navigateur, ou agrandissement dans la fenêtre en secours.
const fullscreenButton=$('fullscreen');
const stageForFullscreen=$('stage');
let fallbackFullscreen=false;
function fullscreenElement(){return document.fullscreenElement || document.webkitFullscreenElement || null;}
function syncFullscreenButton(){
 const active=Boolean(fullscreenElement()) || fallbackFullscreen;
 fullscreenButton.classList.toggle('is-fullscreen',active);
 fullscreenButton.setAttribute('aria-pressed',String(active));
 fullscreenButton.setAttribute('aria-label',active?'Quitter le plein écran':'Passer en plein écran');
 fullscreenButton.title=active?'Quitter le plein écran':'Passer en plein écran';
}
function setFallbackFullscreen(enabled){
 fallbackFullscreen=enabled;
 document.body.classList.toggle('fullscreen-fallback',enabled);
 stageForFullscreen.classList.toggle('fullscreen-fallback-stage',enabled);
 syncFullscreenButton();
}
fullscreenButton.addEventListener('click',()=>{
 if(fallbackFullscreen){setFallbackFullscreen(false);return;}
 if(fullscreenElement()){
  try{
   const exit=document.exitFullscreen || document.webkitExitFullscreen;
   if(exit){Promise.resolve(exit.call(document)).catch(()=>setFallbackFullscreen(false));}
   else setFallbackFullscreen(false);
  }catch(e){setFallbackFullscreen(false);}
  return;
 }
 const request=stageForFullscreen.requestFullscreen || stageForFullscreen.webkitRequestFullscreen;
 if(!request){setFallbackFullscreen(true);return;}
 try{
  Promise.resolve(request.call(stageForFullscreen)).then(syncFullscreenButton).catch(()=>setFallbackFullscreen(true));
 }catch(e){setFallbackFullscreen(true);}
});
document.addEventListener('fullscreenchange',syncFullscreenButton);
document.addEventListener('webkitfullscreenchange',syncFullscreenButton);
document.addEventListener('keydown',e=>{if(e.key==='Escape' && fallbackFullscreen)setFallbackFullscreen(false);});

buildScale();restart();
})();

</script>
